<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>FemCare - Women's Health & Wellness</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error('FemCare Global Error:', e.error || e.message);
        var banner = document.getElementById('femcare-fatal-error');
        if (!banner) {
          banner = document.createElement('div');
          banner.id = 'femcare-fatal-error';
          banner.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#fee2e2;color:#991b1b;border:2px solid #ef4444;border-radius:12px;padding:16px;z-index:999999;font-family:sans-serif;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,0.2);';
          banner.innerHTML = '<strong>App Launch Issue Detected:</strong><br><pre style="white-space:pre-wrap;margin:8px 0;">' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre><button onclick="localStorage.clear();location.reload();" style="background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer;">Clear Storage & Reload</button>';
          document.body.appendChild(banner);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
